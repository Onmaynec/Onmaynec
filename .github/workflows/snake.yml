name: Contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate animated contribution graphs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Onmaynec
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#45e6c9&color_dots=#161b22,#0e433c,#147769,#1bb69a,#45e6c9
            dist/snake-light.svg?palette=github-light&color_snake=#0e907d&color_dots=#ebedf0,#c8eee5,#85d4c1,#38b99d,#0e907d

      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
