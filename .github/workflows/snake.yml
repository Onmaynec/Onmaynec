name: Contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'
      - 'scripts/decorate-snake.mjs'

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile files
        uses: actions/checkout@v4

      - name: Generate animated contribution graphs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Onmaynec
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#AE96FF&color_dots=#131D2E,#1C3745,#275F72,#2BADA7,#9BF4E8
            dist/snake-light.svg?palette=github-light&color_snake=#755BE8&color_dots=#E8F0F7,#CBE6E8,#8ED5D2,#43B7AF,#0E868C

      - name: Style animation panels
        run: node scripts/decorate-snake.mjs

      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
