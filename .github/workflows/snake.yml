name: Contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate animated contribution graphs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Onmaynec
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#B69BFF&color_dots=#172331,#18483F,#1A7567,#32B79D,#6EF1D6
            dist/snake-light.svg?palette=github-light&color_snake=#7658D6&color_dots=#EDF2F7,#CDEFE7,#95DCCB,#4ABDA5,#078F79

      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
